[workspace]
resolver = "2"
members = [
    "crates/engine-api",
    "crates/engine-servo",
    "crates/dom-observer",
    "crates/css-observer",
    "crates/layout-observer",
    "crates/semantic-compiler",
    "crates/event-observer",
    "crates/agent-protocol",
    "crates/transactions",
    "crates/action-planner",
    "crates/audit",
    "crates/profiles",
    "crates/storage",
    "crates/secret-store",
    "crates/permissions",
    "crates/file-broker",
    "crates/clipboard",
    "crates/downloads",
    "crates/uploads",
    "crates/navigation",
    "crates/tabs",
    "crates/workspace",
    "crates/cookies",
    "crates/network",
    "crates/api-discovery",
    "crates/conformance",
    "crates/compatibility-check",
    "crates/cache",
    "crates/indexeddb",
    "crates/service-worker",
    "crates/runtime-observer",
    "crates/frames",
    "crates/shadow-dom",
    "crates/credentials",
    "crates/password-vault",
    "crates/totp",
    "crates/webauthn",
    "crates/identity-vault",
    "crates/payment-vault",
    "crates/ipc",
    "crates/sandbox",
    "crates/logging",
    "crates/metrics",
    "crates/recovery",
    "crates/agent-runtime",
    "crates/process-model",
    "crates/agent-tree",
    "crates/structural-ir",
    "crates/semantic-ir",
    "crates/application-ir",
    "crates/page-text",
    "crates/provenance",
    "crates/state",
    "crates/diff",
    "crates/input",
    "crates/challenge-observer",
    "crates/fingerprint",
    "apps/browsai-cli",
    "apps/browsai-headless",
    "apps/browsai-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
chacha20poly1305 = "0.10"

[patch.crates-io]
servo-script-bindings = { path = "vendor/servo-script-bindings" }
servo-script = { path = "vendor/servo-script" }
servo-storage = { path = "vendor/servo-storage" }
servo-net = { path = "vendor/servo-net" }
servo-canvas = { path = "vendor/servo-canvas" }
